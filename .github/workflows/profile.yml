name: Profile Assets

# Aggregate stats from private repos are fine; repository, org, and account names are not.
# Enforced at three layers: name-free config below, a sanitizer, then a hard grep gate.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose render logs"
        type: boolean
        default: false
      skip_commit:
        description: "Render and verify only, do not commit"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES_DIR: .github/images
  RENDER_DIR: renders

jobs:
  metrics:
    name: Render metrics cards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare output directory
        run: mkdir -p "$RENDER_DIR"

      # Never add `community` or `repositories` to base: they render @org/repo names
      # without any plugin_* toggle being set.
      - name: Render overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          output_action: none
          config_output: svg
          filename: metrics-overview.svg

          repositories: 200
          repositories_batch: 20
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

          base: header, activity, metadata
          base_indepth: yes
          config_display: large
          config_timezone: America/New_York
          config_octicon: yes
          config_twemoji: yes
          config_animations: yes
          config_padding: 0, 8 + 11%
          optimize: css, xml

          retries: 3
          retries_delay: 60
          verify: yes
          debug: ${{ inputs.debug == true }}

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 2

          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          plugin_followup_archived: no

          plugin_reactions: yes
          plugin_reactions_display: absolute
          plugin_reactions_days: 30
          plugin_reactions_limit: 100

      # habits, achievements, calendars and topics are dropped: the first two crash
      # against the current API and the other two render empty.

      # Never enable: notable, activity, repositories, stars, starlists, projects, code,
      # people, contributors, licenses, discussions, sponsors, traffic, stargazers,
      # followup_sections: repositories, lines_sections: repositories|history.

      - name: Collect renders
        if: always()
        run: |
          mkdir -p "$RENDER_DIR"
          cp -v /metrics_renders/*.svg "$RENDER_DIR/" 2>/dev/null || true
          ls -al "$RENDER_DIR"

      - name: Upload metrics renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renders-metrics
          path: ${{ env.RENDER_DIR }}/
          if-no-files-found: warn
          retention-days: 1

  games:
    name: Render contribution games
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare output directory
        run: mkdir -p "$RENDER_DIR"

      - name: Generate snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          # query options: palette, color_snake, color_dots (5 values, low -> high)
          outputs: |
            renders/snake.svg?palette=github-light
            renders/snake-dark.svg?palette=github-dark
            renders/snake-ocean.svg?color_snake=#f97316&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Generate arcade grids
        uses: abozanona/pacman-contribution-graph@8a0caa004b4bb10401ee22aed1f214c8eaf97e4d # v5.3.2
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"
          player_style: opportunistic
          hide_month_labels: "false"

      - name: Collect arcade output
        if: always()
        run: |
          mkdir -p "$RENDER_DIR"
          for f in dist/*.svg; do
            [ -e "$f" ] || continue
            cp -v "$f" "$RENDER_DIR/$(basename "$f" | sed 's/-contribution-graph//')"
          done
          rm -rf dist || true

      - name: Upload game renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renders-games
          path: ${{ env.RENDER_DIR }}/
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    needs: [metrics, games]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download renders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
          merge-multiple: true

      # Drop broken renders before staging so they can never overwrite the last good copy.
      - name: Quarantine failed renders
        run: |
          shopt -s nullglob
          dropped=0
          for f in incoming/*.svg; do
            if grep -qiE "Unexpected error|Something went wrong" "$f"; then
              name="$(basename "$f")"
              echo "::warning file=$IMAGES_DIR/$name::plugin error in render, keeping previous version"
              echo "- \`$name\` failed to render; previous version kept" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$f"
              dropped=$((dropped + 1))
            fi
          done
          echo "quarantined: $dropped"

      # Strip name markup rather than fail a whole run over one stray entry.
      - name: Sanitize renders
        run: |
          shopt -s nullglob
          scrubbed=0
          for f in incoming/*.svg; do
            before="$(md5sum "$f" | cut -d' ' -f1)"
            perl -0pi -e 's{<span class="name">\@[^<]*</span>}{}g' "$f"
            if [ "$before" != "$(md5sum "$f" | cut -d' ' -f1)" ]; then
              echo "::warning file=$IMAGES_DIR/$(basename "$f")::stripped name markup from render"
              scrubbed=$((scrubbed + 1))
            fi
          done
          echo "scrubbed: $scrubbed"

      - name: Stage renders
        run: |
          mkdir -p "$IMAGES_DIR"
          if compgen -G "incoming/*.svg" > /dev/null; then
            cp -v incoming/*.svg "$IMAGES_DIR/"
          else
            echo "::warning::no renders were produced this run"
          fi
          rm -rf incoming

      # Scans carried-over assets too, so a leak from an older config is caught next run.
      - name: Privacy guard
        run: |
          ALLOW='lowlighter/metrics|twitter/twemoji|github/gemoji|jdecked/twemoji|Platane/snk|abozanona/pacman-contribution-graph|yoshi389111/github-profile-3d-contrib|w3\.org|creativecommons\.org'
          hits="$(grep -hoE '(@|github\.com/|gitlab\.com/)[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*' "$IMAGES_DIR"/*.svg 2>/dev/null \
                  | sort -u | grep -Eiv "$ALLOW" || true)"
          if [ -n "$hits" ]; then
            echo "::error::asset contains repository/account names — refusing to commit"
            echo "$hits"
            {
              echo "### Privacy guard failed"
              echo '```'; echo "$hits"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "privacy guard passed"

      - name: Commit and push
        if: inputs.skip_commit != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IMAGES_DIR"
          if git diff --cached --quiet; then
            echo "No asset changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(images): refresh profile assets [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Assets in $IMAGES_DIR"
            echo '```'
            ls -1sh "$IMAGES_DIR" 2>/dev/null | grep -v '^total' || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
